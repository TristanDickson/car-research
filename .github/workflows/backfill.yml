# Backfill from the Wayback Machine, in short chunks: one job per provider with
# its own log and timeout, then one merge job that folds every chunk's result
# into the committed history, regenerates the snapshot and redeploys.
#
# Why chunks: archive.org throttles and is sometimes "temporarily offline", so a
# single long job is opaque until it ends. A chunk's log is readable the moment
# that chunk finishes, a hung page costs that chunk at most one timeout, and a
# chunk that fails leaves the others' results intact. Re-running is safe: a
# capture already folded in is merged, not duplicated.
#
# A big provider is split further: "carwow_deals@0/6" means shard 0 of 6 of
# carwow_deals' pages (every EV on sale is ~180 deals pages). The merge job
# imports the first shard of a provider with --replace-source and the rest on
# top, so together they are that provider's whole history.
name: Backfill from the Wayback Machine

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest capture date (YYYY-MM-DD)"
        default: "2025-01-01"
      every_days:
        description: "At most one capture per this many days per page"
        default: "7"
      providers:
        description: "JSON list of chunks: a provider, or provider@shard/shards"
        default: '["carwow_deals@0/6","carwow_deals@1/6","carwow_deals@2/6","carwow_deals@3/6","carwow_deals@4/6","carwow_deals@5/6","leaseloco@0/3","leaseloco@1/3","leaseloco@2/3","hyundai_offers","ncd","rrg"]'
      max_targets:
        description: "Stop after this many captures per provider (blank = all)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  chunk:
    name: ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(inputs.providers) }}
    env:
      CAR_RESEARCH_DB: /tmp/chunk.sqlite
    steps:
      - name: Split the chunk name into provider and shard
        id: spec
        run: |
          chunk="${{ matrix.chunk }}"
          provider="${chunk%%@*}"
          shard=""; [ "$chunk" != "$provider" ] && shard="${chunk#*@}"
          tag="${provider}-${shard//\//of}"; tag="${tag%-}"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Current history into a local DB (no network)
        run: python -m pipeline refresh --offline --out /tmp/snapshot

      - name: Fold in archived captures for ${{ matrix.chunk }}
        run: |
          args=(--only "${{ steps.spec.outputs.provider }}" --since "${{ inputs.since }}" --every-days "${{ inputs.every_days }}" --out /tmp/snapshot)
          [ -n "${{ inputs.max_targets }}" ] && args+=(--max-targets "${{ inputs.max_targets }}")
          [ -n "${{ steps.spec.outputs.shard }}" ] && args+=(--shard "${{ steps.spec.outputs.shard }}")
          python -u -m pipeline backfill "${args[@]}" 2>&1 | tee /tmp/backfill.log
          echo "--- derivatives in archived pages that resolved to no car (add or ignore in data/seed/trim_map.json):"
          python -m pipeline trims | tee /tmp/trims.log || true
          {
            echo "### ${{ matrix.chunk }}"
            echo '```'
            grep -E "captures to fold in|wayback index|/backfill:|FAILED" /tmp/backfill.log || true
            cat /tmp/trims.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export this chunk's history
        run: python -m pipeline export-history --source "${{ steps.spec.outputs.provider }}" --file "/tmp/history-${{ steps.spec.outputs.tag }}.jsonl"

      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ steps.spec.outputs.tag }}
          path: /tmp/history-${{ steps.spec.outputs.tag }}.jsonl
          retention-days: 7

  merge:
    needs: chunk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAR_RESEARCH_DB: /tmp/merge.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: /tmp/chunks
          merge-multiple: true

      - name: Merge every chunk into the committed history
        run: |
          python -m pipeline refresh --offline --out web/public/data
          declare -A replaced
          for f in $(ls /tmp/chunks/history-*.jsonl 2>/dev/null | sort); do
            p=$(basename "$f" .jsonl); p=${p#history-}; p=${p%-[0-9]*of[0-9]*}
            if [ -z "${replaced[$p]}" ]; then
              python -m pipeline import-history --file "$f" --replace-source "$p"
              replaced[$p]=1
            else
              python -m pipeline import-history --file "$f"
            fi
          done
          [ "${#replaced[@]}" -gt 0 ] || echo "no chunk results"
          python -m pipeline export-history
          python -m pipeline export-snapshot --out web/public/data
          python -m pipeline deal-table > docs/deal-comparison.md
          python -m pipeline status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unmapped trims (report only)
        run: python -m pipeline trims || echo "::warning::archived pages mention derivatives that resolved to no car"

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "car-research scrape"
          git config user.email "actions@users.noreply.github.com"
          git add data/history web/public/data docs/deal-comparison.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Nothing new."
          else
            git commit -m "data: Wayback backfill since ${{ inputs.since }} ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the app with the new snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main

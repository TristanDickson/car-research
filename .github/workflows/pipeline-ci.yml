# Pipeline gate. The raw store lives on the owner's laptop, so CI cannot rebuild the real
# snapshot; it checks the code instead: the unit tests (which build from scratch over a raw
# store of the captured pages in tests/fixtures), and one build over the owner's own files
# with an empty raw store, end to end through the snapshot export.
name: pipeline-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build from the owner's files with an empty raw store
        env:
          CAR_RESEARCH_RAW: /tmp/raw
          CAR_RESEARCH_DB: /tmp/ci.sqlite
        run: |
          python -m pipeline build --out /tmp/snapshot
          python -c "import json; m = json.load(open('/tmp/snapshot/manifest.json')); assert m['counts']['cars'] >= 19, m; print(m['counts'])"

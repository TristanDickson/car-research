# Pipeline gate: unit tests for the finance maths and the import/export path,
# then a freshness check that fails if someone edited data/seed without
# re-running `make snapshot` (the SPA reads the committed snapshot, not the seed).
name: pipeline-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild snapshot offline
        env:
          CAR_RESEARCH_DB: /tmp/ci.sqlite
        # Pin generated_at to the committed one: freshness fields (age, stale)
        # are relative to it, so the diff below is deterministic.
        run: |
          GEN=$(python -c "import json;print(json.load(open('web/public/data/manifest.json'))['generated_at'])")
          python -m pipeline refresh --offline --out /tmp/snapshot --generated-at "$GEN"
      - name: Broker rows with no car (report only)
        env:
          CAR_RESEARCH_DB: /tmp/ci.sqlite
        run: python -m pipeline trims || echo "::warning::broker derivatives that resolved to no car (listed on the Data page)"
      - name: Committed snapshot is up to date
        run: |
          for f in cars.json offers.json requirements.json specs.json models.json; do
            if ! diff -q /tmp/snapshot/$f web/public/data/$f; then
              echo "::error::web/public/data/$f is stale. Run: make snapshot"
              exit 1
            fi
          done

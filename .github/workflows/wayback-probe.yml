# One-off probe: can a GitHub runner reach the Wayback Machine, and how many
# archived copies exist of each price page we scrape? Prints a count per URL.
name: Wayback probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query the CDX index for each source page
        run: |
          for u in \
            "www.carwow.co.uk/hyundai/kona-electric/deals" \
            "www.carwow.co.uk/hyundai/ioniq-3/deals" \
            "www.carwow.co.uk/hyundai/ioniq-5/deals" \
            "www.carwow.co.uk/hyundai/inster/deals" \
            "www.carwow.co.uk/kia/pv5-passenger/deals" \
            "www.carwow.co.uk/kia/ev3/deals" \
            "www.carwow.co.uk/kia/ev2/deals" \
            "www.carwow.co.uk/kia/ev6/deals" \
            "www.hyundai.com/uk/en/offers/new-cars/model/offer.kona_electric.html" \
            "www.hyundai.com/uk/en/offers/new-cars/model/offer.ioniq_5.html" \
            "www.hyundai.com/uk/en/offers/new-cars/model/offer.inster.html" \
            "www.new-car-discount.com/car/hyundai/kona/hatchback/all/all" \
            "www.new-car-discount.com/car/hyundai/ioniq-5/hatchback/all/all" \
            "www.new-car-discount.com/car/kia/ev3/estate/all/all" \
            "www.leaseloco.com/car-leasing/hyundai/kona-electric" \
            "www.leaseloco.com/car-leasing/kia/ev3" \
            "www.rrg-group.com/kia/new-car-offers/pv5-passenger-7-seater/" \
            "www.kia.com/uk/new-cars/pv5-passenger/" \
            "www.hyundai.com/uk/en/models/kona-electric.html"; do
            out=$(curl -sS --max-time 60 "https://web.archive.org/cdx/search/cdx?url=$u&output=json&from=2024&fl=timestamp,statuscode,digest&filter=statuscode:200&collapse=timestamp:8" || echo '[]')
            python3 - "$u" "$out" <<'PY'
          import json, sys
          u, raw = sys.argv[1], sys.argv[2]
          try:
              rows = json.loads(raw)[1:]
          except Exception:
              print(f"{u}: cdx error: {raw[:120]!r}"); sys.exit()
          months = sorted({r[0][:6] for r in rows})
          digests = len({r[2] for r in rows})
          print(f"{u}: {len(rows)} day-snapshots, {digests} distinct bodies, {months[0] if months else '-'}..{months[-1] if months else '-'}; months={months}")
          PY
            sleep 2
          done
      - name: Fetch one archived copy to check the raw-page form works
        run: |
          curl -sS --max-time 60 -o /tmp/page.html -w "status %{http_code} bytes %{size_download}\n" "https://web.archive.org/web/2025id_/https://www.carwow.co.uk/hyundai/kona-electric/deals"
          grep -o "cap_derivative_id=[0-9]*" /tmp/page.html | sort -u | head -5
          grep -o "rrp-value'>[^<]*" /tmp/page.html | head -3

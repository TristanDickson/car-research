# Nightly price scrape: runs every live provider, appends new observations to
# data/history/observations.jsonl, regenerates the snapshot the SPA reads and
# the deal comparison doc, commits, then kicks the Pages deploy (pushes made
# with GITHUB_TOKEN do not trigger other workflows, so we dispatch it).
#
# One provider failing (site down, layout changed) is logged in the run and the
# rest still land; a changed layout shows up as a provider with 0 records and
# its offers drifting to 'stale' in the app after 14 days.
#
# What gets scraped is not a fixed list: carwow_catalog reads Carwow's model
# index first and the Carwow + LeaseLoco scrapers take every electric model
# from it, so a new EV on sale appears here the night after Carwow lists it.
name: Nightly price scrape

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~250 Carwow pages + ~250 LeaseLoco guesses + used stock, up to 250 configurator pages
    # (a week's rotation) and up to 25 minutes of EV Database car pages: about 90 minutes.
    # A job killed at the limit pushes nothing, so the limit is well clear of that.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF text (the makers' specification guides are PDFs)
        # The runner's package index goes stale (a 404 on the .deb); refresh it first. Without
        # pdftotext only hyundai_specs fails, and its rows stay as history has them.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Refresh (live providers + history + snapshot)
        env:
          CAR_RESEARCH_DB: /tmp/scrape.sqlite
        run: |
          python -m pipeline refresh --out web/public/data
          python -m pipeline status
          python -m pipeline deal-table > docs/deal-comparison.md

      - name: Unmapped trims (report only)
        env:
          CAR_RESEARCH_DB: /tmp/scrape.sqlite
        run: |
          python -m pipeline models | tail -1
          python -m pipeline trims || echo "::warning::broker derivatives that resolved to no car; map or ignore them in data/seed/trim_map.json"

      - name: Commit and push if anything changed
        id: commit
        env:
          CAR_RESEARCH_DB: /tmp/scrape.sqlite
        # The scrape takes the best part of an hour; a push to main in that time (a code
        # change) used to reject this push and lose the night's prices. On a rejection, take
        # main as it now is, fold its committed history into this run's database (an
        # upsert, so nothing scraped tonight is lost) and write history and snapshot again
        # with main's code.
        run: |
          git config user.name "car-research scrape"
          git config user.email "actions@users.noreply.github.com"
          changed=false
          for attempt in 1 2 3; do
            git add data/history web/public/data docs/deal-comparison.md
            if git diff --cached --quiet; then
              echo "No price changes."
              break
            fi
            git commit -q -m "data: nightly price scrape $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              changed=true
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::main kept moving; tonight's scrape was not pushed"; exit 1; }
            echo "main moved during the scrape; folding it in (attempt $attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m pipeline refresh --offline --out web/public/data
            python -m pipeline deal-table > docs/deal-comparison.md
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Deploy the app with the new snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
